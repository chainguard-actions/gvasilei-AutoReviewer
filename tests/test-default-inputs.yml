name: Test default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          openai_api_key: fake-openai-key-for-testing
          # model_name and model_temperature use defaults (gpt-3.5-turbo and 0)
          # exclude_files uses default (empty string)

      - name: Assert action failed for non-PR event using default inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-PR event with defaults, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on non-PR event using default inputs"
