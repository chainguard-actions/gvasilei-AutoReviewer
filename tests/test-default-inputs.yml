name: Test default model inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          openai_api_key: sk-fake-key-for-testing
          # model_name defaults to gpt-3.5-turbo
          # model_temperature defaults to 0
          # exclude_files defaults to ""

      - name: Assert action fails gracefully with default inputs on non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-PR event with default inputs, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on non-PR event using default model inputs"
