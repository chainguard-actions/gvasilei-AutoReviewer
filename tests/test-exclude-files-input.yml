name: Test exclude_files input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with exclude_files input (expect graceful failure on non-PR event)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          openai_api_key: sk-fake-key-for-testing
          model_name: gpt-4
          model_temperature: '0'
          exclude_files: '*.md, *.txt'

      - name: Assert action failed gracefully (not a crash) on non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-PR event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with exclude_files input on non-PR event"
