name: Test exclude_files input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token
          openai_api_key: fake-key
          model_name: gpt-3.5-turbo
          model_temperature: '0'
          exclude_files: '*.md, *.json'

      - name: Assert action failed due to non-PR event (not due to exclude_files input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-PR event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly processed exclude_files input and failed on non-PR event"
