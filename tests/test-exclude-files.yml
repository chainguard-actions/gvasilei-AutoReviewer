name: Test exclude_files parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with exclude_files (expect failure on non-PR event)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          openai_api_key: fake-openai-key-for-testing
          exclude_files: "*.md, *.txt, *.json"

      - name: Assert action failed with expected message (not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-PR event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when not run on a pull_request event (exclude_files input accepted)"
